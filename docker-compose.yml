services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-health_api}
      POSTGRES_USER: ${DB_USER:-health_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-health_api}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-health_api} -d ${DB_NAME:-health_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-health_api}
      DB_USER: ${DB_USER:-health_api}
      DB_PASSWORD: ${DB_PASSWORD:-health_api}
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
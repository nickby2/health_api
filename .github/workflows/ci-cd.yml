name: CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

env:
  DJANGO_SECRET_KEY: ci-secret-key
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  DB_ENGINE: django.db.backends.postgresql
  DB_NAME: health_api
  DB_USER: health_api
  DB_PASSWORD: health_api
  DB_HOST: 127.0.0.1
  DB_PORT: 5432

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Lint
        run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: health_api
          POSTGRES_USER: health_api
          POSTGRES_PASSWORD: health_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U health_api -d health_api"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: python -m pip install --upgrade pip poetry
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Run migrations
        run: poetry run python manage.py migrate --noinput
      - name: Run tests
        run: poetry run python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t health-api:${{ github.sha }} .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
          aws-region: ${{ secrets.AWS_REGION_STAGING }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_STAGING }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_STAGING }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION_STAGING }}.amazonaws.com
          docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
      - name: Deploy to ECS staging
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_STAGING }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_STAGING }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_STAGING }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE_STAGING }}
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --force-new-deployment

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: ${{ secrets.AWS_REGION_PROD }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_PROD }}
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${{ secrets.AWS_REGION_PROD }}.amazonaws.com
          docker build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} .
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
      - name: Deploy to ECS production
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_PROD }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER_PROD }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE_PRODUCTION }}
        run: |
          aws ecs update-service \
            --cluster ${ECS_CLUSTER} \
            --service ${ECS_SERVICE} \
            --force-new-deployment